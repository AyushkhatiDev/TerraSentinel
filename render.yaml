services:
  - type: web
    name: terrasentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/terrasentinel.db
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: terrasentinel-data
      mountPath: /var/data
      sizeGB: 1
